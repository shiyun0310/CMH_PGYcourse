<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>畢業後一般醫學訓練 PGY 醫師訓練課程表(PGY查閱)</title>
<meta name="description" content="PGY 輪訓課程表（PGY 查閱版），只保留總覽表與月份檢視，資料以 Google Sheets 為主。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔲</text></svg>">
<!--
  115PGY.html — 精簡版
  由 index.html 裁減而來：只保留「總覽表」與「月份檢視」兩個頁籤，
  移除個人時程頁籤與公告欄，其餘（頁首、篩選列、錯誤提示、頁尾）維持不變。

  · 與 index.html / office.html 共用 assets/ 底下同一份
    config.js / app.js / style.css，改任何一邊的功能三頁都會同步。
  · <body class="gray"> 套用灰色系色票（index.html 粉色、office.html 橘色），
    整頁含表格、分頁與連結都會一起換色，深／淺色模式各有一組。
  · app.js 對不存在的介面元素會安靜跳過：
    沒有 #board 就不會去讀「公告」工作表，
    沒有個人時程頁籤，總覽表的姓名會自動變成純文字而非可點連結。
  · 保留 #banner：正常連線時它是空的完全看不到，
    只有在讀不到 Google Sheets、退回離線範例資料時才會顯示警告 ——
    少了它，使用者會把範例資料誤當成正式課表。
  · ?v= 是版本參數，改過 assets/ 內容要一併更新，否則瀏覽器會用舊快取。
-->
<link rel="stylesheet" href="assets/style.css?v=2026-09-10.2">
</head>
<!-- data-unit-filter：讓月份檢視在標題下方顯示科別複選按鈕列。
     上方的篩選列是「科別」單選（內、外、婦…），這排按鈕是「訓練單位」複選
     （選-眼科、社-郭綜…），兩者粒度不同，可以一起使用。 -->
<body class="gray" data-unit-filter>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <!-- 正方形標誌。viewBox 是正方形，外框 .mark 為 48×44，
           預設的 preserveAspectRatio 會等比縮放並置中，不會被壓扁。 -->
      <svg class="mark" viewBox="0 0 44 44" role="img" aria-label="PGY">
        <defs>
          <linearGradient id="sq" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#DFE4EA"/>
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="38" height="38" rx="5" fill="url(#sq)"/>
        <text x="22" y="27" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC',sans-serif"
              font-size="12" font-weight="800" letter-spacing="-.3" fill="#43505E">PGY</text>
      </svg>
      <div>
        <h1 id="title">畢業後一般醫學訓練 PGY 醫師訓練課程表(PGY查閱)</h1>
        <ul class="notice">
          <li>本頁內容僅供本院 PGY 醫師及相關教學業務人員查閱，內容涉及院內人員及訓練相關資訊，請勿作其他用途。</li>
          <li>本平台將保留頁面瀏覽之連線 IP 紀錄，以維護資訊安全及掌握異常使用情形，請依規範使用本頁內容。</li>
          <li>請妥善保管本頁連結，勿任意轉傳、公開、截圖或提供予非相關人員使用。</li>
          <li>如發現資料有誤或連結遭不當分享，請立即通知教學部。</li>
        </ul>
      </div>
    </div>
    <div class="top-actions">
      <span class="pill is-loading" id="status"><span class="dot"></span>讀取中…</span>
      <button class="btn ghost" id="btn-refresh" title="重新向 Google Sheets 取得最新資料">↻ 重新整理</button>
      <button class="btn ghost" id="btn-theme" title="切換深色 / 淺色">◐ 佈景</button>
    </div>
  </div>
</header>

<main class="wrap">

  <div id="banner"></div>

  <!-- 篩選列只留四個下拉與「清除條件」。
       沒有搜尋框、工作表下拉與科別色塊 —— app.js 對不存在的元素會安靜跳過，
       對應的篩選條件永遠是「全部」，不影響其他功能。
       少了工作表下拉，本頁固定顯示 config.js 的 DEFAULT_SHEET
       （留空＝試算表的第一個工作表）。 -->
  <section class="panel filters">
    <div class="filter-grid">
      <div class="field">
        <label for="f-year">學年度</label>
        <select id="f-year"></select>
      </div>
      <div class="field">
        <label for="f-stage">期程</label>
        <select id="f-stage"></select>
      </div>
      <div class="field">
        <label for="f-group">組別</label>
        <select id="f-group"></select>
      </div>
      <div class="field">
        <label for="f-mentor">長期導師</label>
        <select id="f-mentor"></select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn" id="btn-reset">清除條件</button>
      </div>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-view="grid">總覽表</button>
    <button class="tab" data-view="month">月份檢視</button>
  </nav>

  <section class="panel view" id="view"></section>

  <p class="foot">PGY 訓練課程表 · 前端以 Google Sheets 為單一資料來源<span id="build"></span></p>
</main>

<script src="assets/config.js?v=2026-09-10.2"></script>
<script src="assets/sample-data.js?v=2026-09-10.2"></script>
<script src="assets/app.js?v=2026-09-10.2"></script>
</body>
</html>
