<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PGY 訓練課程表</title>
<meta name="description" content="PGY 輪訓課程表純資料版，供內部網頁嵌入使用。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<!--
  office.html — 純資料版
  保留頁首與總覽表／月份檢視兩個頁籤，
  不放篩選列與頁尾，適合以 iframe 嵌入其他系統或內部網頁。
  整體採橘色系（index.html 為粉色系），兩頁一眼分得出來。

  · 與 index.html 共用 assets/ 底下同一份 config.js / app.js / style.css，
    改任何一邊的功能兩頁都會同步，不需要維護兩份程式。
  · app.js 對不存在的介面元素會安靜跳過，所以這裡少掉的元素不會讓程式出錯。
  · 保留 #banner：正常連線時它是空的完全看不到，
    只有在讀不到 Google Sheets、退回離線範例資料時才會顯示警告 ——
    少了它，使用者會把範例資料誤當成正式課表。
  · ?v= 是版本參數，改過 assets/ 內容要一併更新，否則瀏覽器會用舊快取。
-->
<link rel="stylesheet" href="assets/style.css?v=2026-09-08.11">
</head>
<!-- data-unit-filter：讓月份檢視顯示科別複選按鈕列。
     office.html 沒有上方的篩選列，科部助理需要在月份檢視裡自己挑科別；
     index.html 已有整頁的篩選列，因此不加這個屬性。 -->
<body class="office" data-unit-filter>

<header class="top">
  <svg class="mark-wm" aria-hidden="true" viewBox="3 -1.5 42 41">
    <path d="M24.00 0.00 29.76 13.07 43.97 14.51 33.32 24.03 36.34 37.99 24.00 30.80 11.66 37.99 14.68 24.03 4.03 14.51 18.24 13.07Z"
          fill="#FFFFFF"/>
  </svg>
  <div class="wrap">
    <div class="brand">
      <div>
        <h1 id="title">PGY 訓練課程表</h1>
        <p id="subtitle">畢業後一般醫學訓練</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="pill is-loading" id="status"><span class="dot"></span>讀取中…</span>
      <button class="btn ghost" id="btn-refresh" title="重新向 Google Sheets 取得最新資料">↻ 重新整理</button>
      <button class="btn ghost" id="btn-theme" title="切換深色 / 淺色">◐ 佈景</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-view="grid">總覽表</button>
    <button class="tab" data-view="month">月份檢視</button>
  </nav>

  <section class="panel view" id="view"></section>
</main>

<script src="assets/config.js?v=2026-09-08.11"></script>
<script src="assets/sample-data.js?v=2026-09-08.11"></script>
<script src="assets/app.js?v=2026-09-08.11"></script>
</body>
</html>
